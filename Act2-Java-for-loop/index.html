<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotoMak</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --paper: #ffffff;
      --ink: #15171a;
      --muted: #6b7077;
      --line: #e8e9eb;
      --tint: #f5f6f7;
      --accent: #4d4d4d;

      --bs-body-bg: var(--paper);
      --bs-body-color: var(--ink);
      --bs-body-font-family: "Instrument Sans", system-ui, sans-serif;
    }

    body {
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    .brand,
    .price {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
    }

    .siteNav {
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -0.03em;
      color: var(--ink);
      text-decoration: none;
    }

    .siteNav .nav-link {
      color: var(--muted);
      font-size: .95rem;
    }

    .siteNav .nav-link:hover {
      color: var(--ink);
    }

    .hero {
      padding-top: 70px;
      padding-bottom: 70px;
    }

    .hero h1 {
      font-weight: 800;
      font-size: clamp(3.2rem, 11vw, 9rem);
      line-height: .92;
      letter-spacing: -0.05em;
      margin: 0;
    }

    .hero p {
      max-width: 34ch;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.5;
      margin: 2rem 0 2.25rem;
    }

    .btnInk {
      background: var(--ink);
      color: #fff;
      border: 1px solid var(--ink);
      border-radius: 0;
      padding: .8rem 1.6rem;
      font-weight: 500;
      transition: background .2s, border-color .2s;
    }

    .btnInk:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btnLine {
      border: 1px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      padding: .8rem 1.6rem;
      font-weight: 500;
      background: transparent;
    }

    .btnLine:hover {
      background: var(--ink);
      color: #fff;
    }

    .btn:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .sectionHead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 1px solid var(--ink);
      padding-top: 2rem;
      margin-bottom: 2.5rem;
    }

    .sectionHead h2 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .sectionHead span {
      color: var(--muted);
      font-size: .95rem;
    }

    .Footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .9rem;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="row siteNav align-items-center py-3">
      <div class="col">
        <div class="brand">
          MotoMak
        </div>
      </div>
      <div class="col-auto">
        <div class="nav">
          <div class="nav-item">
            <a class="nav-link" href="#bikes">
              Bikes
            </a>
          </div>
          <div class="nav-item">
            <a class="nav-link" href="">
              Contact
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="row hero align-items-center">
      <div class="col-12 col-lg-6">
        <h1>Bike bike<br>bike bikee.</h1>
        <p>Look for a bike, pick one, ride it.</p>
        <a href="#bikes" class="btn btnInk">
          Browse bikes
        </a>
      </div>
      <div class="col-12 col-lg-6 d-none d-lg-block mt-0">
        <img src="img/bike.png" alt="" class="img-fluid w-100">
      </div>
    </div>

    <div class="row" id="bikes">
      <div class="col-12 sectionHead">
        <h2>Make your choice now!</h2>
      </div>
    </div>

    <div class="row g-5 pb-5 mb-5" id="parent">

    </div>

    <div class="row Footer py-4" id="contact">
      <div class="col">
        <span>© 2026 MotoMak</span>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  var bikes = [
{
      model: "Yamaha YZF-R1",
      type: "Supersport",
      price: "$17,999",
      description: "Next-generation R-Series styling with refined aerodynamic efficiency and track-focused performance.",
      image: "img/rzfr1.jpg"
    },
    {
      model: "Yamaha MT-09",
      type: "Hyper Naked",
      price: "$10,599",
      description: "Torque-rich CP3 engine combined with aggressive design and sophisticated electronic rider aids.",
      image: "img/mt09.jpg"
    },
    {
      model: "Yamaha Ténéré 700",
      type: "Adventure Touring",
      price: "$10,799",
      description: "Lightweight, go-anywhere dual-sport built for long-distance comfort and off-road capability.",
      image: "img/tenere.jpg"
    },
    {
      model: "Yamaha MT-07",
      type: "Hyper Naked",
      price: "$8,199",
      description: "Class-leading CP2 engine delivering thrilling torque, agile handling, and striking street presence.",
      image: "img/mt07.jpg"
    },
    {
      model: "Yamaha XSR900",
      type: "Sport Heritage",
      price: "$10,299",
      description: "Retro-inspired styling backed by modern electronics, a powerful CP3 engine, and a lightweight chassis.",
      image: "img/xsr.jpg"
    },
    {
      model: "Kawasaki Ninja H2",
      type: "Hypersport",
      price: "$32,100",
      description: "Supercharged 998cc inline-four engine delivering unprecedented acceleration and aerodynamic performance.",
      image: "img/h2.jpg"
    }
  ];

  var elParent = document.getElementById("parent");

  for (var i = 0; i < bikes.length; i++) {
      elParent.innerHTML += 
            '<div class="col-12 col-md-6 col-lg-4">' +
              '<div class="card rounded-3 p-4 h-100" style="background: var(--tint); border: 1px solid var(--line); background-color: white;">' +
                '<div style="width: 100%; height: 200px; overflow: hidden;" class="mb-3 d-flex align-items-center justify-content-center">' +
                  '<img src="' + bikes[i].image + '" style="width: 100%; height: 100%; object-fit: contain;" alt="' + bikes[i].model + '">' +
                '</div>' +
                '<div class="text-uppercase text-muted small mb-2">' + bikes[i].type + '</div>' +
                '<div class="h3 mb-3">' + bikes[i].model + '</div>' +
                '<div class="price h4 mb-3">' + bikes[i].price + '</div>' +
                '<div class="text-muted" style="font-size: 0.95rem;">' + bikes[i].description + '</div>' +
              '</div>' +
            '</div>';
  }
</script>
</body>

</html>
